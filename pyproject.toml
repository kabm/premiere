[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rushes"
version = "0.1.0"
description = "Colour-managed editing, LUT grading and high-end mastering for camera footage, built on FFmpeg"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
rushes = "rushes.cli:main"

[project.gui-scripts]
rushes-studio = "rushes.studio.app:main"

[tool.setuptools.packages.find]
include = ["rushes*"]

[tool.setuptools.package-data]
"rushes.studio" = ["static/*"]
